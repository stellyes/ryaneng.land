AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Low-cost monthly sticky board with durable DynamoDB invalidations.

Parameters:
  SiteOrigin:
    Type: String
    Default: https://ryaneng.land
    AllowedPattern: 'https://[A-Za-z0-9.-]+(:[0-9]+)?'
  MaxNotes:
    Type: Number
    Default: 500
    MinValue: 1
    MaxValue: 500
  LocalOrigin:
    Type: String
    Default: http://127.0.0.1:8765
    AllowedValues: [http://127.0.0.1:8765]
  ReservedConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 50
    Description: API reserved concurrency; zero omits reservation for low-quota accounts.
  BroadcastReservedConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 10
    Description: Broadcaster reserved concurrency; zero omits reservation.
  NotificationEmail:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[^@\s]+@[^@\s]+\.[^@\s]+$'
    Description: Optional email for account-wide budget and broadcast notifications.

Conditions:
  ReserveApiConcurrency: !Not [!Equals [!Ref ReservedConcurrency, 0]]
  ReserveBroadcastConcurrency: !Not [!Equals [!Ref BroadcastReservedConcurrency, 0]]
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, '']]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    MemorySize: 256
    Timeout: 20
    Tracing: PassThrough

Resources:
  BoardTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
        - AttributeName: month
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: MonthIndex
          KeySchema:
            - AttributeName: month
              KeyType: HASH
            - AttributeName: connectionId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  ImagesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref SiteOrigin, !Ref LocalOrigin, "http://localhost:5500", "http://127.0.0.1:5500"]
            AllowedMethods: [POST]
            AllowedHeaders: ['*']
            MaxAge: 300
      LifecycleConfiguration:
        Rules:
          - Id: StagedOneDay
            Status: Enabled
            Prefix: staged/
            ExpirationInDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: PublishedFortyDays
            Status: Enabled
            Prefix: published/
            ExpirationInDays: 40

  ImagesOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-images'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ImagesDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: private-images
            DomainName: !GetAtt ImagesBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt ImagesOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: private-images
          ViewerProtocolPolicy: https-only
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  ImagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImagesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontPublishedOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${ImagesBucket.Arn}/published/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${ImagesDistribution}'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ImagesBucket.Arn
              - !Sub '${ImagesBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      Auth:
        EnableIamAuthorizer: true
      CorsConfiguration:
        AllowOrigins: [!Ref SiteOrigin, !Ref LocalOrigin, "http://localhost:5500", "http://127.0.0.1:5500"]
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, PATCH, OPTIONS]
        MaxAge: 300
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      AccessLogSettings:
        DestinationArn: !GetAtt HttpAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","status":"$context.status","route":"$context.routeKey","error":"$context.integrationErrorMessage"}'

  HttpAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ApiFunction/
      Handler: app.handler
      ReservedConcurrentExecutions: !If
        - ReserveApiConcurrency
        - !Ref ReservedConcurrency
        - !Ref AWS::NoValue
      Environment:
        Variables:
          BOARD_TABLE: !Ref BoardTable
          CONNECTIONS_TABLE: !Ref ConnectionsTable
          IMAGES_BUCKET: !Ref ImagesBucket
          CDN_HOST: !GetAtt ImagesDistribution.DomainName
          ALLOWED_ORIGIN: !Ref SiteOrigin
          LOCAL_ORIGIN: !Ref LocalOrigin
          WS_URL: !Sub 'wss://${WebSocketApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/live'
          MAX_NOTES: !Ref MaxNotes
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BoardTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - Statement:
            - Effect: Allow
              Action: dynamodb:ConditionCheckItem
              Resource: !GetAtt BoardTable.Arn
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
              Resource:
                - !Sub '${ImagesBucket.Arn}/staged/*'
                - !Sub '${ImagesBucket.Arn}/published/*'
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/live/POST/@connections/*'
      Events:
        Devices:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: /devices, Method: POST}
        Board:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: /board, Method: GET}
        Revision:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: /revision, Method: GET}
        CreateNote:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: /notes, Method: POST}
        MoveNote:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: '/notes/{id}', Method: PATCH}
        BumpNote:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: '/notes/{id}/bump', Method: POST}
        Upload:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: /uploads, Method: POST}
        Finalize:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: '/uploads/{assetId}/finalize', Method: POST}
        Ticket:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: /connections/ticket, Method: POST}
        AdminDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/notes/{id}
            Method: DELETE
            Auth: {Authorizer: AWS_IAM}
        AdminSettings:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/settings
            Method: PUT
            Auth: {Authorizer: AWS_IAM}

  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ApiFunction}'
      RetentionInDays: 7

  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-realtime'
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: '$request.body.action'

  WebSocketIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiFunction.Arn}/invocations'

  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      Target: !Sub 'integrations/${WebSocketIntegration}'

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      Target: !Sub 'integrations/${WebSocketIntegration}'

  HeartbeatRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: heartbeat
      Target: !Sub 'integrations/${WebSocketIntegration}'

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $default
      Target: !Sub 'integrations/${WebSocketIntegration}'

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    DependsOn: [ConnectRoute, DisconnectRoute, HeartbeatRoute, DefaultRoute]
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: live
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5

  WebSocketPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*'

  BroadcastFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: BroadcastFunction/
      Handler: broadcast.handler
      Timeout: 60
      ReservedConcurrentExecutions: !If
        - ReserveBroadcastConcurrency
        - !Ref BroadcastReservedConcurrency
        - !Ref AWS::NoValue
      Environment:
        Variables:
          CONNECTIONS_TABLE: !Ref ConnectionsTable
          WS_MANAGEMENT_URL: !Sub 'https://${WebSocketApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/live'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - Statement:
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/live/POST/@connections/*'
            - Effect: Allow
              Action: [sqs:SendMessage]
              Resource: !GetAtt BroadcastFailures.Arn
      Events:
        DurableEvents:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt BoardTable.StreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 1
            ParallelizationFactor: 1
            BisectBatchOnFunctionError: true
            FunctionResponseTypes: [ReportBatchItemFailures]
            MaximumRetryAttempts: -1
            MaximumRecordAgeInSeconds: -1
            DestinationConfig:
              OnFailure:
                Type: SQS
                Destination: !GetAtt BroadcastFailures.Arn
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName":["INSERT"],"dynamodb":{"NewImage":{"SK":{"S":[{"prefix":"EVENT#"}]}}}}'

  BroadcastLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${BroadcastFunction}'
      RetentionInDays: 7

  BroadcastFailures:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  BroadcastFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Broadcast exhausted stream retention; inspect and replay the failure queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt BroadcastFailures.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasNotificationEmail
        - [!Ref OperationsTopic]
        - !Ref AWS::NoValue

  BroadcastLagAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Durable broadcast stream is falling behind; inspect Lambda errors/throttles.
      Namespace: AWS/Lambda
      MetricName: IteratorAge
      Dimensions:
        - Name: FunctionName
          Value: !Ref BroadcastFunction
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 300000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasNotificationEmail
        - [!Ref OperationsTopic]
        - !Ref AWS::NoValue

  OperationsTopic:
    Type: AWS::SNS::Topic
    Condition: HasNotificationEmail
    Properties:
      DisplayName: Sticky board broadcast alerts

  OperationsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn: !Ref OperationsTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  AccountMonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasNotificationEmail
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-account-monthly-cost'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 30
          Unit: USD
        CostTypes:
          IncludeCredit: false
          IncludeRefund: false
          IncludeTax: true
          IncludeSubscription: true
          IncludeSupport: true
          IncludeUpfront: true
          IncludeRecurring: true
          IncludeOtherSubscription: true
          UseBlended: false
          UseAmortized: false
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            ThresholdType: ABSOLUTE_VALUE
            Threshold: 5
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref NotificationEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            ThresholdType: ABSOLUTE_VALUE
            Threshold: 15
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref NotificationEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            ThresholdType: ABSOLUTE_VALUE
            Threshold: 30
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref NotificationEmail

Outputs:
  ApiUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  WebSocketUrl:
    Value: !Sub 'wss://${WebSocketApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/live'
  MediaUrl:
    Value: !Sub 'https://${ImagesDistribution.DomainName}'
  BoardTableName:
    Value: !Ref BoardTable
  ConnectionsTableName:
    Value: !Ref ConnectionsTable
  ImagesBucketName:
    Value: !Ref ImagesBucket
  DistributionId:
    Value: !Ref ImagesDistribution
  BroadcastFailureQueueUrl:
    Value: !Ref BroadcastFailures
  AdminInvokeResource:
    Value: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/$default/*/admin/*'
  OperationsTopicArn:
    Condition: HasNotificationEmail
    Value: !Ref OperationsTopic
  AccountBudgetName:
    Condition: HasNotificationEmail
    Value: !Sub '${AWS::StackName}-account-monthly-cost'
