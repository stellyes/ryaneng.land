<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Pattern Studio tests</title></head>
<body>
<h1>Pattern Studio model and storage tests</h1>
<pre id="results">Running...</pre>
<script type="module">
import { parseGridSize, gridDimensions, resizeCells, cropCells, extendCells, mirrorCells, rotateCells, referenceRect, extendBoard, mirrorBoard, rotateBoard, flood, line, validateProject, openStore } from '../tools/pattern-studio/model.js';
import { CROP_RATIOS, fitCrop, moveCrop, resizeCrop } from '../tools/pattern-studio/crop.js';
import { ZERO_SCORE_DISTANCE, closestYarn, colorDistance, colorUsage, findClosestColor, matchCustomMix, matchScore, matchYarnLine, prepareYarnLines, rankYarnLines } from '../tools/pattern-studio/palette.js';
import { boxFromCells, brush, copyCells, objectCorners, rasterObject, resizeObject, shapeMask, strokeWidth } from '../tools/pattern-studio/objects.js';
import { approximateGrid, approximationDimensions } from '../tools/pattern-studio/approximation.js';
const results = [];
const assert = (condition, name) => {
    if (!condition) throw new Error(name);
    results.push(`PASS ${name}`);
};
const rejects = (run, name) => {
    let threw = false;
    try { run(); } catch { threw = true; }
    assert(threw, name);
};
const database = `pattern-studio-test-${crypto.randomUUID()}`;
let store;
try {
    const pixels = colors => Uint8ClampedArray.from(colors.flatMap(color => color === null
        ? [0, 0, 0, 0] : [parseInt(color.slice(1, 3), 16), parseInt(color.slice(3, 5), 16), parseInt(color.slice(5, 7), 16), 255]));
    const stripes = ['#550000', '#990000', '#dd0000', '#ff5555'].flatMap(color => Array(20).fill(color));
    const shadeSettings = { rgba: pixels(stripes), cols: 20, rows: 4, colors: 8, merge: 3, blocks: 0 };
    const shades = approximateGrid(shadeSettings);
    assert(shades.palette.length === 4 && stripes.every((color, i) => shades.cells[i] === color),
        'Approximation keeps four distinct red shades rather than flattening a hue');
    assert(JSON.stringify(shades) === JSON.stringify(approximateGrid(shadeSettings)), 'Approximation is deterministic');
    const nearColors = { rgba: pixels(['#cc1111', '#ce1212', '#cc1111', '#ce1212']), cols: 4, rows: 1, colors: 4, blocks: 0 };
    assert(approximateGrid({ ...nearColors, merge: 3 }).palette.length === 1, 'Nearly identical image shades collapse into one color');
    const limited = approximateGrid({ ...shadeSettings, colors: 2 });
    assert(limited.palette.length <= 2 && limited.cells.length === 80 && limited.cells.every(c => limited.palette.includes(c)),
        'Approximation respects the hard color limit and complete grid shape');
    const transparent = approximateGrid({ rgba: new Uint8ClampedArray([255, 0, 0, 0, 0, 0, 0, 128]), cols: 2, rows: 1, blocks: 0 });
    assert(transparent.cells[0] === null && transparent.cells[1] === '#7f7f7f' && transparent.usage[0].count === 1,
        'Transparent cells remain empty and partial alpha composites over white');
    const dot = Array(25).fill('#000000'); dot[12] = '#ffffff';
    const isolated = { rgba: pixels(dot), cols: 5, rows: 5, colors: 2 };
    assert(approximateGrid({ ...isolated, blocks: 0 }).cells[12] === '#ffffff' &&
        approximateGrid({ ...isolated, blocks: 2 }).cells.every(c => c === '#000000'), 'Block cleanup removes an isolated stitch and can be disabled');
    const rare = approximateGrid({ ...isolated, blocks: 0, minimum: 2 });
    assert(rare.palette.length === 1 && rare.usage[0].count === 25, 'Minimum color usage reallocates a rare color to a common one');
    const solid = approximateGrid({ rgba: pixels(Array(16).fill('#2468ac')), cols: 4, rows: 4, colors: 32 });
    assert(solid.palette.length === 1 && solid.palette[0] === '#2468ac', 'Uniform images do not invent extra palette colors');
    assert(shades.usage.reduce((sum, color) => sum + color.count, 0) === 80, 'Stitch counts equal the number of painted cells');
    assert(approximationDimensions(500, 250, 200).rows === 100 &&
        approximationDimensions(250, 500, 500).cols === 250, 'Grid dimensions preserve image proportions and enforce the longest-edge cap');
    const sizeFromRows = approximationDimensions(240, 180, 76, 'rows');
    assert(sizeFromRows.cols === 101 && sizeFromRows.rows === 76, 'Height controls derive a consistent aspect-locked grid');
    rejects(() => approximateGrid({ rgba: pixels([null]), cols: 1, rows: 1 }), 'Fully transparent approximation reports an explicit error');
    for (const bad of [{ colors: 33 }, { cols: 501 }, { colors: 1.5 }, { blocks: -1 }, { merge: 11 }, { rgba: [] }]) {
        rejects(() => approximateGrid({ ...shadeSettings, ...bad }), 'Invalid approximation setting rejected: ' + Object.keys(bad)[0]);
    }
    rejects(() => approximationDimensions(100, 100, 0), 'Invalid approximation dimensions rejected');
    const brightened = approximateGrid({ rgba: pixels(['#808080']), cols: 1, rows: 1, brightness: 20 });
    assert(brightened.palette[0] === '#b3b3b3', 'Brightness controls apply before quantization');
    const approximationWorker = new Worker('../tools/pattern-studio/approximation-worker.js', { type: 'module' });
    try {
        const workerResult = await new Promise((resolve, reject) => {
            const timeout = setTimeout(() => reject(new Error('Approximation worker timed out.')), 10000);
            approximationWorker.onmessage = event => { clearTimeout(timeout); resolve(event.data); };
            approximationWorker.onerror = event => { clearTimeout(timeout); reject(new Error(event.message)); };
            approximationWorker.postMessage(shadeSettings);
        });
        assert(JSON.stringify(workerResult.result) === JSON.stringify(shades), 'Worker output matches the pure approximation algorithm');
    } finally { approximationWorker.terminate(); }
    const chartImage = new Image();
    chartImage.src = '../tools/pattern-studio/feature-reference/3EB%20-%20Cover%20-%20Stitch%20Fiddle.png';
    await chartImage.decode();
    const chartSource = document.createElement('canvas');
    chartSource.width = chartSource.height = 500;
    chartSource.getContext('2d').drawImage(chartImage, 0, 0, 500, 500);
    const chartSample = size => {
        const sample = document.createElement('canvas');
        sample.width = sample.height = size;
        const ctx = sample.getContext('2d');
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(chartSource, 0, 0, size, size);
        return ctx.getImageData(0, 0, size, size).data;
    };
    const chartAnalysis = chartSample(100);
    for (const size of [100, 200, 500]) {
        for (const colors of [6, 16, 32]) {
            const chart = approximateGrid({ rgba: chartSample(size), analysisRgba: chartAnalysis, cols: size, rows: size, colors });
            const reds = chart.palette.filter(color => {
                const r = parseInt(color.slice(1, 3), 16), g = parseInt(color.slice(3, 5), 16);
                return r > 80 && g < r * 0.3;
            });
            const yellow = chart.palette.some(color => {
                const [r, g, b] = [1, 3, 5].map(at => parseInt(color.slice(at, at + 2), 16));
                return r > 150 && g > r * 0.5 && b < g * 0.5;
            });
            assert(chart.palette.length === 6 && reds.length === 3 && yellow &&
                colorDistance('#000000', findClosestColor('#000000', chart.palette)) < 0.25 &&
                colorDistance('#ffffff', findClosestColor('#ffffff', chart.palette)) < 0.15,
                `3EB produces three reds, yellow, black and white at ${size} x ${size} with a ${colors}-color limit`);
        }
    }
    const yarnColors = Object.freeze(['#f9f9f9', '#d0cbc7', '#b6acb4', '#fed6d5']);
    assert(findClosestColor('#d0cbc7', yarnColors) === '#d0cbc7', 'Palette matcher returns an exact match');
    assert(findClosestColor('#D0CBC7', yarnColors) === '#d0cbc7', 'Palette matcher accepts uppercase input');
    assert(findClosestColor('#ffffff', yarnColors) === '#f9f9f9', 'Palette matcher finds the closest light yarn color');
    assert(findClosestColor('#ffffff', ['#123ABC']) === '#123ABC', 'Single-color palette returns the original entry unchanged');
    assert(findClosestColor('#123abc', ['#123ABC', '#123abc']) === '#123ABC', 'Equal palette distances keep the first entry');
    assert(findClosestColor('#808080', ['#000000', '#ffffff']) === '#ffffff', 'Palette matcher uses perceptual rather than raw RGB distance');
    for (const invalid of ['red', '#fff', '#12345678', '#gggggg', '', null, 123456]) {
        rejects(() => findClosestColor(invalid, yarnColors), `Palette matcher rejects invalid input ${JSON.stringify(invalid)}`);
        rejects(() => findClosestColor('#123456', ['#123456', invalid]), `Palette matcher validates entries even after an exact match: ${JSON.stringify(invalid)}`);
    }
    for (const invalid of [[], null, {}, '#ffffff', new Array(1)]) {
        rejects(() => findClosestColor('#123456', invalid), `Palette matcher rejects invalid palette ${JSON.stringify(invalid)}`);
    }
    assert(matchScore(0) === 100 && matchScore(ZERO_SCORE_DISTANCE) === 0 && matchScore(1) === 0, 'Match score runs from 100 (exact) to 0 (far)');
    assert(colorDistance('#808080', '#808080') === 0 && colorDistance('#000000', '#ffffff') > 0.99, 'Color distance is perceptual Oklab distance');
    const usage = colorUsage(['#FF0000', '#ff0000', null, '#0000ff'], ['#00ff00', '#ff0000']);
    assert(usage.length === 3 && usage.find(item => item.color === '#ff0000').count === 2 && usage.find(item => item.color === '#00ff00').count === 0,
        'Color usage counts painted cells case-insensitively and includes unused palette colors');
    const lines = prepareYarnLines({
        Tiny: ['#ff0000'],
        Exact: ['#ff0000', '#00ff00', '#0000ff', '#ffffff'],
        Close: ['#f00505', '#05f005', '#0505f0'],
    });
    assert(lines[0].labs instanceof Float64Array && lines[0].labs.length === 3, 'Yarn lines cache Oklab values');
    const rgb = colorUsage(['#ff0000', '#00ff00', '#0000ff'], []);
    const exact = matchYarnLine(rgb, lines[1]);
    assert(Math.round(exact.score) === 100 && exact.usable === 3 && exact.total === 3, 'An exact line scores 100 with every color usable');
    const tiny = matchYarnLine(rgb, lines[0]);
    assert(tiny.usable === 1 && tiny.score < 40 && [...tiny.mapping.values()].filter(match => match.shared).length === 2,
        'A line with too few yarns cannot reuse one yarn for distinct colors');
    const ranked = rankYarnLines(rgb, lines, 2);
    assert(ranked.length === 2 && ranked[0].name === 'Exact' && ranked[1].name === 'Close', 'Ranking orders lines by score and honors the limit');
    const nearTwins = matchYarnLine(colorUsage(['#ff0000', '#fe0101'], []), lines[0]);
    assert(nearTwins.usable === 2 && nearTwins.mapping.get('#fe0101').yarn === '#ff0000', 'Near-identical project colors share one yarn');
    const weighted = matchYarnLine(colorUsage(['#ff0000', '#ff0000', '#ff0000', '#ff0000', '#00ff00'], []), prepareYarnLines({ Red: ['#ff0000', '#000000'] })[0]);
    const unweighted = matchYarnLine(colorUsage(['#ff0000', '#00ff00'], []), prepareYarnLines({ Red: ['#ff0000', '#000000'] })[0]);
    assert(weighted.score > unweighted.score, 'Colors covering more of the pattern weigh more in the score');
    assert(rankYarnLines([], lines).length === 0 && matchYarnLine([], lines[0]).score === 0, 'An empty project has no recommendations');
    const mixLines = prepareYarnLines({
        Reds: ['#ff0000', '#000000'], Greens: ['#00ff00', '#000000'], Blues: ['#0505f0'],
    });
    const mix = matchCustomMix(rgb, mixLines);
    assert(mix.custom && mix.mapping.get('#ff0000').line === 'Reds' && mix.mapping.get('#00ff00').line === 'Greens' &&
        mix.mapping.get('#0000ff').line === 'Blues' && mix.lines === 3 && mix.size === 3, 'Custom mix picks each color\'s closest yarn from any line');
    assert(mix.score > Math.max(...rankYarnLines(rgb, mixLines, 3).map(result => result.score)), 'Custom mix beats every single line it draws from');
    const twins = matchCustomMix(colorUsage(['#ff0000', '#ff0000', '#e00000'], []), prepareYarnLines({ A: ['#ff0000'], B: ['#ff0000', '#d80000'] }));
    assert(twins.mapping.get('#ff0000').yarn === '#ff0000' && twins.mapping.get('#e00000').yarn === '#d80000' && twins.size === 2,
        'Distinct colors get distinct yarns and identical hexes across lines count once');
    assert(closestYarn('#0000fa', mixLines).line === 'Blues' && matchCustomMix([], mixLines).total === 0, 'Closest yarn searches every line; empty projects have no mix');
    for (const invalid of [null, [], { Bad: [] }, { Bad: ['red'] }]) {
        rejects(() => prepareYarnLines(invalid), `Yarn catalog rejects ${JSON.stringify(invalid)}`);
    }
    const color = '#123456';
    const box = boxFromCells({ x: 7, y: 8 }, { x: 3, y: 2 });
    assert(box.width === 5 && box.height === 7 && box.cx === 5.5 && box.cy === 5.5, 'Object drag includes start/end cells in either direction');
    const segment = { kind: 'line', a: { x: 1, y: 2 }, b: { x: 7, y: 4 } };
    const linePixels = rasterObject(segment, 10, 10, color);
    assert(linePixels.size === 7 && linePixels.get(21) === color && linePixels.get(47) === color, 'Editable line raster includes exact endpoints');
    assert([...rasterObject(segment, 10, 10, '#abcdef').values()].every(c => c === '#abcdef'), 'Changing palette recolors every preview line cell');
    assert(rasterObject({ kind: 'line', a: { x: 0, y: 0 }, b: { x: 0, y: 0 } }, 1, 1, color).size === 1, 'Single-cell line is supported');
    assert(rasterObject({ kind: 'line', a: { x: -4, y: 0 }, b: { x: 4, y: 0 } }, 3, 3, color).size === 3, 'Line raster clips to grid');
    const rect = { kind: 'shape', shape: 'rectangle', filled: true, ...boxFromCells({ x: 1, y: 1 }, { x: 5, y: 3 }) };
    assert(rasterObject(rect, 10, 10, color).size === 15, 'Filled rectangle has exact inclusive pixel dimensions');
    const outline = rasterObject({ ...rect, filled: false }, 10, 10, color);
    assert(outline.size === 12 && !outline.has(22), 'Rectangle outline leaves interior untouched');
    assert(shapeMask('ellipse', 5, 5, true).filter(Boolean).length === 21, 'Ellipse filled mask is symmetric and pixel centered');
    for (const shape of ['rectangle', 'ellipse', 'triangle', 'star']) {
        for (const [width, height] of [[1, 1], [1, 12], [12, 1], [11, 9]]) {
            const filled = shapeMask(shape, width, height, true), border = shapeMask(shape, width, height, false);
            assert(filled.length === width * height && filled.some(Boolean) && border.some(Boolean) &&
                border.every((v, i) => !v || filled[i]), `${shape} ${width}x${height} supports filled/outline including thin shapes`);
        }
        const rotated = rasterObject({ ...rect, shape, width: 15, height: 13, cx: 8, cy: 8, angle: 37 }, 16, 16, color);
        assert(rotated.size > 0 && [...rotated.keys()].every(i => i >= 0 && i < 256), `${shape} rotation stays inside destination grid`);
    }
    const original = { cols: 3, rows: 2, cells: ['#111111', null, '#333333', '#444444', '#555555', null] };
    const copied = copyCells(original, boxFromCells({ x: 1, y: 0 }, { x: 2, y: 1 }));
    assert(copied.width === 2 && copied.height === 2 && JSON.stringify(copied.cells) === JSON.stringify([null, '#333333', '#555555', null]), 'Copy retains exact dimensions, colors, and empty cells');
    original.cells[2] = '#999999';
    assert(copied.cells[1] === '#333333', 'Clipboard snapshot does not change when source painting changes');
    const paste = { kind: 'paste', cx: 3, cy: 3, width: 2, height: 2, angle: 0,
        source: { width: 2, height: 2, cells: ['#111111', '#222222', '#333333', null] } };
    const pasted = rasterObject(paste, 6, 6, '#ffffff');
    assert(pasted.size === 3 && pasted.get(14) === '#111111' && !pasted.has(21), 'Paste preserves original colors and leaves empty cells transparent');
    const quarter = rasterObject({ ...paste, angle: 90 }, 6, 6, color);
    assert(quarter.get(14) === '#333333' && quarter.get(15) === '#111111' && !quarter.has(20) && quarter.get(21) === '#222222', '90-degree paste rotation maps exact source cells around the center');
    const enlarged = rasterObject({ ...paste, cx: 2, cy: 2, width: 4, height: 4 }, 6, 6, color);
    assert(enlarged.size === 12 && enlarged.get(0) === '#111111' && enlarged.get(3) === '#222222', 'Pasted pixels resize with nearest-neighbor sampling');
    assert(rasterObject({ ...paste, cx: 0, cy: 0 }, 2, 2, color).size === 0, 'Clipped empty paste cells never erase destination pixels');
    const resizedBox = resizeObject({ ...rect, cx: 5, cy: 5, width: 4, height: 4 }, 'se', { x: 9, y: 8 });
    assert(resizedBox.width === 6 && resizedBox.height === 5 && resizedBox.cx === 6 && resizedBox.cy === 5.5, 'Resize changes axes independently while anchoring opposite corner');
    const turned = { ...rect, angle: 90 }, oldCorner = objectCorners(turned)[0];
    const turnedResize = resizeObject(turned, 'se', { x: 2, y: 8 }), newCorner = objectCorners(turnedResize)[0];
    assert(Math.abs(oldCorner.x - newCorner.x) < 1e-9 && Math.abs(oldCorner.y - newCorner.y) < 1e-9, 'Rotated resize anchors the opposite corner without moving it');
    assert(rasterObject({ kind: 'selection', ...box }, 10, 10, color).size === 0, 'Selection border never paints into the grid');
    assert(rasterObject({ ...rect, width: 500, height: 500, cx: 250, cy: 250, angle: 0 }, 500, 500, color).size === 250000, 'Maximum-size filled shape renders every cell');
    const brushed = [];
    brush(5, 5, 3, (x, y) => brushed.push(`${x},${y}`));
    assert(brushed.length === 9 && brushed[0] === '4,4' && brushed[8] === '6,6', 'Odd brush width is centered on the cell');
    brushed.length = 0;
    brush(5, 5, 2, (x, y) => brushed.push(`${x},${y}`));
    assert(brushed.join(' ') === '5,5 6,5 5,6 6,6', 'Even brush width extends right/down from the cell');
    assert(strokeWidth('abc') === 1 && strokeWidth(0) === 1 && strokeWidth(21) === 1 && strokeWidth(7) === 7, 'Invalid stroke widths fall back to 1');
    const thickLine = rasterObject({ ...segment, a: { x: 1, y: 5 }, b: { x: 8, y: 5 }, stroke: 3 }, 10, 10, color);
    assert(thickLine.size === 30 && thickLine.has(41) && thickLine.has(61) && !thickLine.has(31), 'Line width 3 paints a 3-cell-thick band');
    assert(rasterObject({ ...segment, stroke: 1 }, 10, 10, color).size === linePixels.size, 'Line width 1 matches the original line');
    const thickRect = rasterObject({ ...rect, filled: false, width: 8, height: 8, cx: 4, cy: 4, stroke: 2 }, 10, 10, color);
    assert(thickRect.size === 48 && thickRect.has(11) && !thickRect.has(22), 'Outline width 2 is two cells thick and keeps the interior open');
    assert(JSON.stringify(shapeMask('ellipse', 11, 9, false, 1)) === JSON.stringify(shapeMask('ellipse', 11, 9, false)), 'Outline width defaults to 1');
    for (const shape of ['rectangle', 'ellipse', 'triangle', 'star']) {
        const fill = shapeMask(shape, 15, 13, true), thin = shapeMask(shape, 15, 13, false, 1), thick = shapeMask(shape, 15, 13, false, 3);
        assert(thick.every((v, i) => !v || fill[i]) && thin.every((v, i) => !v || thick[i]) &&
            thick.filter(Boolean).length > thin.filter(Boolean).length, `${shape} thick outline contains the thin outline inside the shape`);
    }
    assert(shapeMask('rectangle', 4, 4, false, 20).every(Boolean), 'Outline wider than the shape fills it without overflowing');
    for (const [text, expected] of [['50', 50], ['50.99', 50], ['4.9', 4], ['500.999', 500], ['+42.8', 42], [' 12.0 ', 12], ['49.99999999', 49], ['49.99999999999999999999', 49]]) {
        assert(parseGridSize(text) === expected, `Grid size ${text} rounds down to ${expected}`);
    }
    for (const text of ['20a', 'a20', '2e2', 'NaN', 'Infinity', '', ' ', '0x20', '12px', '1,000', '3.99', '3.9999999999999999999999', '-4.2', '501', '50.2.1']) {
        rejects(() => parseGridSize(text), `Invalid grid size "${text}" rejected`);
    }
    for (const [name, ratio] of Object.entries(CROP_RATIOS)) {
        const rect = fitCrop(499, 333, ratio);
        assert(rect.width * ratio[1] === rect.height * ratio[0], `${name} crop has exact integer-pixel proportions`);
        assert(rect.x >= 0 && rect.y >= 0 && rect.x + rect.width <= 499 && rect.y + rect.height <= 333, `${name} crop fits inside reference`);
        const scaled = fitCrop(499, 333, ratio, 0.5);
        assert(scaled.width < rect.width && scaled.width * ratio[1] === scaled.height * ratio[0], `${name} scale preserves ratio`);
        for (const corner of ['nw', 'ne', 'sw', 'se']) {
            const resized = resizeCrop(scaled, corner, -1000, 1000, 499, 333, ratio);
            assert(resized.width > 0 && resized.height > 0 && resized.x >= 0 && resized.y >= 0 &&
                resized.x + resized.width <= 499 && resized.y + resized.height <= 333 &&
                resized.width * ratio[1] === resized.height * ratio[0], `${name} ${corner} resize is bounded and ratio-locked`);
        }
    }
    rejects(() => fitCrop(2, 2, CROP_RATIOS.wide), 'Too-small reference rejects impossible exact preset');
    const free = fitCrop(200, 100, null);
    const freeSized = resizeCrop(free, 'se', -50, -20, 200, 100);
    assert(freeSized.width === 150 && freeSized.height === 80, 'Free crop independently resizes width and height');
    const moved = moveCrop(freeSized, 999, -999, 200, 100);
    assert(moved.x === 50 && moved.y === 0, 'Crop movement clamps both axes to reference bounds');
    const cropSource = { width: 4, height: 2, cols: 4, rows: 2, cells: ['#000000', '#111111', null, '#333333', '#444444', '#555555', null, '#777777'] };
    assert(JSON.stringify(cropCells(cropSource, { x: 1, y: 0, width: 2, height: 2 }, 2, 2)) ===
        JSON.stringify(['#111111', null, '#555555', null]), 'Cropping paint selects included cells and preserves transparency');
    assert(JSON.stringify(cropCells(cropSource, { x: 0, y: 0, width: 4, height: 2 }, 4, 2)) ===
        JSON.stringify(cropSource.cells), 'Full-frame paint crop is unchanged');
    assert(JSON.stringify(gridDimensions(500, 250, 50)) === '{"cols":50,"rows":25}', 'Landscape grid preserves proportions');
    assert(JSON.stringify(gridDimensions(250, 500, 50)) === '{"cols":25,"rows":50}', 'Portrait grid preserves proportions');
    assert(gridDimensions(500, 1, 4).rows === 1, 'Very thin references keep at least one row');
    assert(gridDimensions(499, 333, 500).cols === 500, 'Grid supports the 500-cell maximum');
    const cells = ['#000000', '#ffffff', '#000000', '#ffffff'];
    flood(cells, 2, 2, 0, 0, '#ff0000');
    assert(cells.join(',') === '#ff0000,#ffffff,#ff0000,#ffffff', 'Bucket changes only connected target color');
    assert(!flood(cells, 2, 2, 0, 0, '#ff0000'), 'Filling with the same color is a no-op');
    flood(cells, 2, 2, 1, 0, null);
    assert(cells[1] === null && cells[3] === null && cells[0] === '#ff0000', 'Flood helper supports clearing a connected target color');
    const diagonal = ['#000000', null, null, '#000000'];
    flood(diagonal, 2, 2, 0, 0, null);
    assert(diagonal[3] === '#000000', 'Diagonal cells are not connected');
    const edge = [null, '#ffffff', '#ffffff', null];
    flood(edge, 2, 2, 1, 0, '#ff0000');
    assert(edge[2] === '#ffffff', 'Fill does not wrap across row boundaries');
    const full = Array(250000).fill(null);
    flood(full, 500, 500, 0, 0, '#123456');
    assert(full.every(color => color === '#123456'), 'Maximum-size fill completes without recursion overflow');
    const visited = [];
    line(0, 0, 8, 2, (x, y) => visited.push([x, y]));
    assert(visited.length === 9 && visited[8][0] === 8 && visited[8][1] === 2, 'Swipe interpolation includes both ends with no horizontal gaps');
    const reverse = [];
    line(2, 8, 0, 0, (x, y) => reverse.push([x, y]));
    assert(reverse.length === 9 && reverse[8].join() === '0,0', 'Reverse vertical swipe interpolation');
    const resized = resizeCells(['#000000', null, null, '#ffffff'], 2, 2, 4, 4);
    assert(resized[0] === '#000000' && resized[3] === null && resized[15] === '#ffffff', 'Grid resizing preserves paint and transparent cells');
    // 3 x 2 grid: a b c / d e f
    const abc = ['a', 'b', 'c', 'd', 'e', 'f'];
    const wider = extendCells(abc, 3, 2, { left: 1, right: 2 });
    assert(wider.cols === 6 && wider.rows === 2 && wider.cells.join() === ',a,b,c,,,,d,e,f,,', 'Adding columns pads blank cells on the chosen sides');
    const taller = extendCells(abc, 3, 2, { top: 1, bottom: 1 });
    assert(taller.cols === 3 && taller.rows === 4 && taller.cells.join() === ',,,a,b,c,d,e,f,,,', 'Adding rows pads blank cells above and below');
    assert(mirrorCells(abc, 3, 2, 'horizontal').join() === 'c,b,a,f,e,d', 'Horizontal mirror flips left-right and keeps the odd center column');
    assert(mirrorCells(abc, 3, 2, 'vertical').join() === 'd,e,f,a,b,c', 'Vertical mirror flips top-bottom');
    assert(mirrorCells(['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i'], 3, 3, 'vertical').slice(3, 6).join() === 'd,e,f', 'Vertical mirror keeps the odd center row');
    const right = rotateCells(abc, 3, 2, true);
    assert(right.cols === 2 && right.rows === 3 && right.cells.join() === 'd,a,e,b,f,c', 'Rotate right turns the grid clockwise');
    const left = rotateCells(abc, 3, 2, false);
    assert(left.cols === 2 && left.rows === 3 && left.cells.join() === 'c,f,b,e,a,d', 'Rotate left turns the grid counter-clockwise');
    assert(rotateCells(right.cells, 2, 3, false).cells.join() === abc.join(), 'Rotating right then left restores the grid');
    const board = { width: 240, height: 180, cols: 50, rows: 38, referenceRect: null };
    const padded = extendBoard(board, { left: 2, right: 1, top: 1 });
    assert(Math.abs(padded.width - 240 * 53 / 50) < 1e-6 && Math.abs(padded.height - 180 * 39 / 38) < 1e-6,
        'Adding cells grows the board by whole cells at the same cell size');
    assert(padded.referenceRect.width === 240 && padded.referenceRect.height === 180 &&
        Math.abs(padded.referenceRect.x - 9.6) < 1e-6 && Math.abs(padded.referenceRect.y - 180 / 38) < 1e-6,
        'Adding cells keeps the reference size and shifts it with the original cells');
    const paddedBoard = { ...board, ...padded, cols: 53, rows: 39 };
    const flipped = mirrorBoard(paddedBoard, 'horizontal').referenceRect;
    assert(Math.abs(flipped.x - (paddedBoard.width - 9.6 - 240)) < 1e-6 && flipped.y === padded.referenceRect.y, 'Mirroring moves the reference to the mirrored side');
    assert(mirrorBoard(board, 'vertical').referenceRect === null, 'Mirroring an unpadded board keeps the reference full-board');
    const turnedBoard = rotateBoard(paddedBoard, true);
    assert(turnedBoard.width === paddedBoard.height && turnedBoard.referenceRect.width === 180 && turnedBoard.referenceRect.height === 240 &&
        Math.abs(turnedBoard.referenceRect.y - 9.6) < 1e-6, 'Rotating swaps the board and reference sizes');
    const back = rotateBoard({ ...paddedBoard, ...turnedBoard }, false).referenceRect;
    assert(Math.abs(back.x - padded.referenceRect.x) < 1e-6 && Math.abs(back.y - padded.referenceRect.y) < 1e-6,
        'Rotating right then left restores the reference position');
    assert(referenceRect(board).width === 240 && referenceRect(paddedBoard).x === padded.referenceRect.x, 'Reference rect defaults to the full board');
    const record = {
        version: 1, id: 'test-project', name: 'Test', width: 2, height: 2, cols: 2, rows: 2,
        palette: ['#000000'], cells: ['#000000', null, null, null],
        reference: 'data:image/png;base64,AAAA', updatedAt: Date.now(),
    };
    assert(validateProject(record) === record, 'Valid project schema accepted');
    const blankRecord = { ...record, blank: true, palette: [], cells: Array(4).fill(null) };
    assert(validateProject(blankRecord) === blankRecord, 'Blank projects use the existing project schema');
    rejects(() => validateProject({ ...record, width: 501 }), 'Oversized references rejected');
    rejects(() => validateProject({ ...record, cols: 501 }), 'Oversized grids rejected');
    rejects(() => validateProject({ ...record, cells: [] }), 'Wrong cell count rejected');
    rejects(() => validateProject({ ...record, cells: ['red', null, null, null] }), 'Invalid paint colors rejected');
    rejects(() => validateProject({ ...record, reference: 'https://example.com/image.png' }), 'Remote reference URLs rejected');
    assert(validateProject({ ...record, palette: [] }).palette.length === 0, 'Empty palettes accepted for new projects');
    rejects(() => validateProject({ ...record, palette: ['red'] }), 'Invalid palette colors rejected');
    rejects(() => validateProject({ ...record, width: 2, height: 1 }), 'Mismatched grid proportions rejected');
    rejects(() => validateProject({ ...record, version: 2 }), 'Unknown project version rejected');
    const paddedRecord = { ...record, width: 3, height: 2, cols: 3, rows: 2, cells: Array(6).fill(null), referenceRect: { x: 1, y: 0, width: 2, height: 2 } };
    assert(validateProject(paddedRecord) === paddedRecord, 'Padded boards with a placed reference accepted');
    assert(validateProject({ ...paddedRecord, width: 2.4, referenceRect: { x: 0.4, y: 0, width: 2, height: 2 } }), 'Fractional padded boards accepted');
    rejects(() => validateProject({ ...paddedRecord, referenceRect: { x: 2, y: 0, width: 2, height: 2 } }), 'Reference outside the board rejected');
    rejects(() => validateProject({ ...paddedRecord, referenceRect: { x: 0, y: 0, width: 1.5, height: 2 } }), 'Non-integer reference size rejected');
    store = await openStore(database);
    await store.run('readwrite', table => table.put(blankRecord));
    const blankSaved = await store.run('readonly', table => table.get(record.id));
    assert(blankSaved.blank && blankSaved.cells.every(cell => cell === null) && !blankSaved.palette.length,
        'Blank project metadata and empty cells survive saving and reopening');
    await store.run('readwrite', table => table.put(record));
    const saved = await store.run('readonly', table => table.get(record.id));
    assert(saved.cells[0] === '#000000' && saved.cells[1] === null && saved.reference === record.reference, 'IndexedDB round trip retains painting, transparency and reference');
    await store.run('readwrite', table => table.put({ ...record, name: 'Updated' }));
    const listed = await store.run('readonly', table => table.getAll());
    assert(listed.length === 1 && listed[0].name === 'Updated', 'Saving updates rather than duplicates a project');
    await store.run('readwrite', table => table.put({ ...record, palette: [], cells: Array(4).fill(null) }));
    const empty = await store.run('readonly', table => table.get(record.id));
    assert(validateProject(empty).palette.length === 0, 'Empty-palette projects survive save and reopen validation');
    await store.run('readwrite', table => table.delete(record.id));
    assert((await store.run('readonly', table => table.getAll())).length === 0, 'Deleting removes a saved project');
    document.body.dataset.result = 'passed';
} catch (error) {
    results.push(`FAIL ${error.stack}`);
    document.body.dataset.result = 'failed';
} finally {
    if (store) store.close();
    indexedDB.deleteDatabase(database);
    document.getElementById('results').textContent = results.join('\n');
}
</script>
</body>
</html>
