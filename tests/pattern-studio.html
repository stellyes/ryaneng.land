    assert(layered.cells === topLayer.cells && copyCells(layered, { cx: 1, cy: 1, width: 2, height: 2 }).cells[0] === '#ff0000',
        'Painting and copying address the active layer, not the composite');
    assert(flattenLayers(layered).join() === '#ff0000,#00ff00,,', 'Topmost painted layer cells win in the composite');
    topLayer.visible = false;
    assert(compositeColor(layered, 0) === '#000000' && flattenLayers(layered)[1] === null, 'Hidden layers do not render');
    topLayer.visible = true;
    assert(compositeColor(layered, 0, new Map([[0, '#ffffff']])) === '#ffffff', 'Placement previews render at the active layer depth');
    assert(compositeColor(layered, 0, new Map([[1, '#ffffff']]), true) === '#000000',
        'Layer transform previews replace old pixels and reveal lower layers');
    layered.activeLayerId = bottomLayer.id;
    assert(compositeColor(layered, 0, new Map([[0, '#ffffff']])) === '#ff0000', 'Upper layers occlude a lower-layer edit preview');
    layered.activeLayerId = topLayer.id;
    bindLayer(layered);
    const folder = { id: crypto.randomUUID(), type: 'folder', name: 'Group', parentId: null, visible: true, expanded: true };
    topLayer.parentId = folder.id;
    layered.layers = [folder, bottomLayer, topLayer];
    assert(layerOrder(layered).map(item => item.id).join() === [folder.id, topLayer.id, bottomLayer.id].join(),
        'Folders display children indented in top-first compositing order');
    folder.visible = false;
    assert(!layerVisible(layered, topLayer) && flattenLayers(layered)[0] === '#000000', 'Folder visibility hides all its children');
    folder.visible = true;
    folder.expanded = false;
    assert(flattenLayers(layered)[0] === '#ff0000', 'Collapsing a folder does not hide its pixels');
    const serialized = serializeLayers(layered);
    assert(serialized.cells !== topLayer.cells && serialized.cells[0] === '#ff0000' &&
        layered.cells === topLayer.cells && validateProject(serialized) === serialized,
        'Version 2 backups retain layers and flatten only the compatibility preview');
    const serializedClone = structuredClone(serialized);
    serializedClone.layers.find(layer => layer.id === topLayer.id).cells[0] = '#abcdef';
    assert(topLayer.cells[0] === '#ff0000', 'Saved snapshots do not alias live layer cells');
    layered.activeLayerId = folder.id;
    bindLayer(layered);
    assert(activeLayer(layered) === folder && layered.cells.every(cell => cell === null), 'Selecting a folder cannot paint a raster layer');
    layered.activeLayerId = topLayer.id;
    bindLayer(layered);
    for (let mask = 0; mask < 16; mask++) {
        const locked = newLayer(2, 1, 'Locks', ['#000000', null]);
        LOCKS.forEach((key, index) => { locked.locks[key] = Boolean(mask & (1 << index)); });
        const { all, transparency, color, position } = locked.locks;
        assert(canWrite(locked, '#000000') === (!all && !color) &&
            canWrite(locked, null) === (!all && !transparency), `Layer write lock matrix ${mask}`);
        assert(writeLayerCell(locked, 0, null) === (!all && !color && !transparency) &&
            writeLayerCell(locked, 1, '#ffffff') === (!all && !transparency), `Layer erase/paint lock matrix ${mask}`);
        assert(canTransform(locked) === (!all && !position), `Layer position lock matrix ${mask}`);
    }
    topLayer.locks.transparency = true;
    assert(compositeColor(layered, 0, new Map([[0, null]])) === '#ff0000' &&
        compositeColor(layered, 3, new Map([[3, '#ffffff']])) === null,
        'Transparency-locked previews cannot erase painted pixels or fill empty pixels');
    topLayer.locks.transparency = false;
    assert(JSON.stringify(layerBounds(layered, topLayer)) === '{"x":0,"y":0,"width":2,"height":1}',
        'Layer selection uses the painted bounding box');
    assert(layerBounds(layered, newLayer(2, 2)).height === 2, 'Blank layer selection covers the full grid');
    topLayer.locks.all = true;
    transformLayers(layered, cells => extendCells(cells, 2, 2, { left: 1 }).cells, 3, 2);
    assert(layered.layers.find(layer => layer.id === topLayer.id).cells[1] === '#ff0000' &&
        layered.layers.find(layer => layer.id === bottomLayer.id).cells[1] === '#000000' &&
        activeLayer(layered).locks.all && layered.cells === activeLayer(layered).cells,
        'Whole-canvas edits transform every layer, preserve locks, and rebind active cells');
    rejects(() => transformLayers({ layers: Array(17).fill({ type: 'layer' }) }, () => [], 500, 500),
        'Grid transforms enforce the four-million-layer-cell limit before mutation');
    assert(MAX_LAYERS === 64 && MAX_LAYER_CELLS === 4000000 && BLEND_MODES.length === 27 &&
        BLEND_MODES.includes('Linear Dodge') && BLEND_MODES.includes('Luminosity'), 'Layer limits and requested blend mode list are exact');
    for (const [label, change] of [
        ['duplicate IDs', data => { data.layers[1].id = data.layers[0].id; }],
        ['missing active layer', data => { data.activeLayerId = 'missing'; }],
        ['missing parent', data => { data.layers[2].parentId = 'missing'; }],
        ['self-parent folder', data => { data.layers[0].parentId = data.layers[0].id; }],
        ['unknown blend', data => { data.layers[1].blendMode = 'unknown'; }],
        ['negative opacity', data => { data.layers[1].opacity = -0.01; }],
        ['excess opacity', data => { data.layers[1].opacity = 1.01; }],
        ['non-numeric opacity', data => { data.layers[1].opacity = '0.5'; }],
        ['invalid locks', data => { data.layers[1].locks.all = 1; }],
        ['wrong cell count', data => { data.layers[1].cells = []; }],
        ['invalid color', data => { data.layers[1].cells[0] = 'red'; }],
        ['empty name', data => { data.layers[1].name = ' '; }],
        ['too many entries', data => { data.layers = Array(65).fill(data.layers[0]); }],
    ]) {
        const invalid = structuredClone(serialized);
        change(invalid);
        rejects(() => validateLayers(invalid), `Invalid layer schema rejects ${label}`);
    }
    {
        const object = { cx: 12, cy: 12, width: 4, height: 4, angle: 0 };
        const target = { x: 40, y: 30, width: 20, height: 20 };
        for (const [axis, delta, value] of [['x', 30, 40], ['x', 38, 50], ['x', 46, 60],
            ['y', 20, 30], ['y', 28, 40], ['y', 36, 50]]) {
            const result = snapTranslation(object, axis === 'x' ? delta + 0.6 : 0,
                axis === 'y' ? delta + 0.6 : 0, [target], 100, 100);
            assert(result[axis === 'x' ? 'dx' : 'dy'] === delta &&
                result.guides.some(guide => guide.axis === axis && guide.value === value),
                `Dragging snaps ${axis} edge/center metric ${value}`);
        }
        const board = [{ x: 0, y: 0, width: 100, height: 60 }];
        const near = snapTranslation(object, -7.01, 0, board, 100, 60);
        assert(near.dx === -10 && near.guides.some(g => g.axis === 'x' && g.value === 0),
            'Canvas left edge snaps inside the 3% horizontal threshold');
        const far = snapTranslation(object, -6.99, 0, board, 100, 60);
        assert(far.dx === -7 && !far.guides.length, 'Dragging past 3% releases snapping using raw pointer distance');
        assert(snapTranslation(object, 0, -8.21, board, 100, 60).dy === -10 &&
            snapTranslation(object, 0, -8.19, board, 100, 60).dy === -8,
            'Vertical tolerance is 3% of height, not width');
        for (const [dx, dy, x, y] of [[38.8, 18.8, 50, 30], [86.8, 46.8, 100, 60]]) {
            const snapped = snapTranslation(object, dx, dy, board, 100, 60);
            assert(snapped.guides.some(g => g.axis === 'x' && g.value === x) &&
                snapped.guides.some(g => g.axis === 'y' && g.value === y),
                `Canvas axes/outer edges snap simultaneously at ${x},${y}`);
        }
        const odd = snapTranslation({ ...object, width: 3, cx: 11.5 }, 38.5, 0,
            [{ x: 50, y: 0, width: 0, height: 0 }], 10, 60);
        assert(Number.isInteger(odd.dx) && odd.guides.every(g => g.axis !== 'x'),
            'Incompatible half-cell centers never introduce fractional pixel translations');
        const nearest = snapTranslation(object, 27.1, 0, [target, { x: 39, y: 80, width: 20, height: 10 }], 100, 100);
        assert(nearest.dx === 27 && nearest.guides[0].value === 39, 'Nearest metric wins rather than first target');
        assert(snapTranslation(object, -110.9, 0, [{ x: -100, y: 0, width: 20, height: 20 }], 100, 60).dx === -110,
            'Snapping supports negative off-canvas coordinates');
    }
    const placementFixture = document.createElement('div');
    placementFixture.style.cssText = 'position:absolute;left:-10000px;top:0;width:200px;height:150px';
    placementFixture.innerHTML = `
        <div id="workspace"><canvas id="placement-test-canvas" width="200" height="150"></canvas></div>
        <div id="object-overlay"><svg id="object-outline"><line id="line-hit"/><polygon id="box-hit" data-edit="move"/></svg>
          <button data-edit="a"></button><button data-edit="b"></button>
          <button data-edit="resize" data-resize="nw"></button><button data-edit="resize" data-resize="ne"></button>
          <button data-edit="resize" data-resize="se"></button><button data-edit="resize" data-resize="sw"></button>
          <button data-edit="rotate" data-rotate="nw"></button><button data-edit="rotate" data-rotate="ne"></button>
          <button data-edit="rotate" data-rotate="se"></button><button data-edit="rotate" data-rotate="sw"></button></div>
        <p id="object-help"></p><input id="object-width"><input id="object-height"><input id="object-angle">
        <select id="shape-type"><option>rectangle</option></select><select id="shape-fill"><option>filled</option></select>
        <button id="placement-apply"></button><button id="placement-cancel"></button>`;
    document.body.append(placementFixture);
    try {
        const placementProject = migrateLayers({ cols: 3, rows: 2, cells: ['#ff0000', null, null, null, null, null] });
        const placementLayer = activeLayer(placementProject), testCanvas = document.getElementById('placement-test-canvas');
        let lastNotice = '', commitCount = 0, replacement = false, snapping = true;
        const editor = createPlacementEditor({
            canvas: testCanvas, getProject: () => placementProject, getColor: () => '#ffffff', getStroke: () => 1,
            canTransform: () => canTransform(placementLayer), updateControls() {},
            getSnapping: () => snapping,
            redraw: () => editor.render(), notify: text => { lastNotice = text; },
            commitPixels(pixels, replace = false) {
                commitCount++;
                replacement = replace;
                let changed = false;
                if (replace) {
                    for (let i = 0; i < placementLayer.cells.length; i++) {
                        const color = pixels.get(i) ?? null;
                        if (placementLayer.cells[i] !== color) changed = true;
                        placementLayer.cells[i] = color;
                    }
                } else for (const [index, color] of pixels) changed = writeLayerCell(placementLayer, index, color) || changed;
                return changed;
            },
        });
        const key = name => editor.keydown({ key: name, target: testCanvas, preventDefault() {} });
        const selectPixels = () => editor.selectLayer(layerBounds(placementProject, placementLayer));
        selectPixels();
        assert(editor.layerSelected && editor.selecting && !editor.preview().size && !editor.transformingLayer,
            'Layer selection alone has no paint preview or data mutation');
        key('ArrowRight');
        assert(editor.transformingLayer && editor.preview().get(1) === '#ff0000' && placementLayer.cells[0] === '#ff0000',
            'Arrow transforms remain disposable previews until committed');
        editor.cancel();
        assert(!editor.active && placementLayer.cells[0] === '#ff0000' && !commitCount, 'Cancelling a layer transform leaves its cells unchanged');
        selectPixels();
        key('ArrowRight');
        editor.commit();
        assert(replacement && placementLayer.cells[0] === null && placementLayer.cells[1] === '#ff0000' && commitCount === 1,
            'Committing a layer transform replaces rather than duplicates its pixels');
        placementLayer.locks.position = true;
        selectPixels();
        key('ArrowDown');
        const width = document.getElementById('object-width');
        width.value = '2';
        width.dispatchEvent(new Event('change'));
        assert(!editor.transformingLayer && !editor.preview().size && width.value === '1' && lastNotice.includes('position-locked'),
            'Position lock blocks both keyboard and numeric layer transforms');
        editor.commit();
        assert(commitCount === 1, 'Committing an unchanged layer selection creates no pixel edit');
        placementLayer.locks.position = false;
        selectPixels();
        key('ArrowRight');
        editor.copy();
        assert(placementLayer.cells[1] === null && placementLayer.cells[2] === '#ff0000' && width.value === '1',
            'Copy finalizes a transformed layer and retains its painted bounds');
        editor.paste();
        assert(editor.kind === 'paste' && width.value === '1', 'Layer clipboard content pastes with its actual bounds, not whole-board padding');
        editor.cancel(true);
        placementLayer.locks.all = true;
        selectPixels();
        editor.copy();
        assert(editor.canPaste, 'Fully locked layers can still be selected and copied');
        editor.cut();
        assert(placementLayer.cells[2] === '#ff0000' && lastNotice.includes('no pixels were cut'), 'Cut respects pixel locks and reports that it did not erase');
        selectPixels();
        key('Delete');
        assert(placementLayer.cells[2] === '#ff0000' && lastNotice.includes('No pixels were deleted'), 'Delete respects pixel locks and reports a blocked edit');
        editor.cancel(true);
        placementLayer.locks.all = false;
        placementProject.cols = 100; placementProject.rows = 60;
        placementLayer.cells = Array(6000).fill(null);
        placementLayer.cells[1010] = '#ff0000'; placementLayer.cells[1313] = '#ff0000';
        bindLayer(placementProject);
        selectPixels();
        const overlay = document.getElementById('object-overlay'), hit = document.getElementById('box-hit');
        overlay.setPointerCapture = () => {};
        overlay.hasPointerCapture = () => false;
        const rect = testCanvas.getBoundingClientRect();
        const pointer = (type, x, y = 12) => new PointerEvent(type, { bubbles: true, pointerId: 7,
            isPrimary: true, button: 0, clientX: rect.left + x / 100 * rect.width, clientY: rect.top + y / 60 * rect.height });
        hit.dispatchEvent(pointer('pointerdown', 12));
        overlay.dispatchEvent(pointer('pointermove', 4.9));
        assert(hit.getAttribute('points').startsWith('0,10') && overlay.querySelectorAll('.snap-guides line').length === 1,
            'Pointer layer drag shows a guide and snapped preview without committing');
        snapping = false; editor.refreshSnapping();
        assert(hit.getAttribute('points').startsWith('3,10') && !overlay.querySelector('.snap-guides line'),
            'Turning snapping off immediately restores the unsnapped pointer preview');
        snapping = true; editor.refreshSnapping();
        overlay.dispatchEvent(pointer('pointermove', 5.1));
        assert(hit.getAttribute('points').startsWith('3,10') && !overlay.querySelector('.snap-guides line'),
            'Dragging beyond the magnetic range releases the layer');
        overlay.dispatchEvent(pointer('pointermove', 4.9));
        overlay.dispatchEvent(pointer('pointerup', 4.9));
        assert(hit.getAttribute('points').startsWith('0,10') && !overlay.querySelector('.snap-guides line'),
            'Pointer release retains snapped position and clears temporary guides');
        editor.cancel(true);
        assert(placementLayer.cells[1010] === '#ff0000', 'Cancelling a snapped drag preserves original layer pixels');
        for (const [corner, x, y] of [['nw', 8, 8], ['ne', 16, 8], ['se', 16, 16], ['sw', 8, 16]]) {
            selectPixels();
            const zone = overlay.querySelector(`[data-rotate="${corner}"]`);
            assert(!zone.hidden, `Outside ${corner} rotation zone is available for a layer selection`);
            zone.dispatchEvent(pointer('pointerdown', x, y));
            const dx = x - 12, dy = y - 12;
            overlay.dispatchEvent(pointer('pointermove', 12 - dy, 12 + dx));
            overlay.dispatchEvent(pointer('pointerup', 12 - dy, 12 + dx));
            assert(document.getElementById('object-angle').value === '90' && width.value === '4' &&
                editor.transformingLayer, `${corner} outside drag rotates without resizing`);
            editor.cancel(true);
        }
        selectPixels();
        editor.keydown({ key: 'ArrowRight', target: overlay.querySelector('[data-rotate="ne"]'), preventDefault() {} });
        assert(document.getElementById('object-angle').value === '1' && width.value === '4',
            'Focused outside-corner controls retain keyboard rotation');
        editor.cancel(true);
        editor.startKeyboard('select', { x: 10, y: 10 });
        assert([...overlay.querySelectorAll('[data-rotate]')].every(button => button.hidden),
            'Copy-only area selections do not expose unsupported rotation controls');
        editor.cancel(true);
        selectPixels();
        overlay.querySelector('[data-resize="se"]').dispatchEvent(pointer('pointerdown', 14, 14));
        overlay.dispatchEvent(pointer('pointermove', 16, 17));
        overlay.dispatchEvent(pointer('pointerup', 16, 17));
        assert(width.value === '6' && document.getElementById('object-height').value === '7' &&
            document.getElementById('object-angle').value === '0', 'Direct corner drag resizes rather than rotating');
        editor.cancel(true);
        placementLayer.locks.position = true;
        selectPixels();
        overlay.querySelector('[data-rotate="nw"]').dispatchEvent(pointer('pointerdown', 8, 8));
        overlay.dispatchEvent(pointer('pointermove', 16, 8));
        assert(!editor.dragging && !editor.transformingLayer && lastNotice.includes('position-locked'),
            'Outside-corner rotation respects position locks');
        placementLayer.locks.position = false;
        editor.cancel(true);
        const second = newLayer(100, 60, 'Second');
        second.cells[1212] = '#000000'; second.cells[2020] = '#000000';
        const outside = newLayer(100, 60, 'Outside');
        outside.offCanvas = [[-3, -2, '#ffffff']];
        const folder = { id: 'selection-folder', type: 'folder', name: 'Selection folder', parentId: null, visible: true, collapsed: true };
        const nested = { ...folder, id: 'selection-nested', parentId: folder.id };
        second.parentId = folder.id; outside.parentId = nested.id;
        placementProject.layers.push(folder, second, nested, outside);
        placementProject.selectedLayerIds = [placementLayer.id, folder.id, second.id];
        bindLayer(placementProject);
        editor.selectLayers();
        const outlines = () => [...overlay.querySelectorAll('.selected-layer-outlines rect')];
        assert(outlines().length === 2 && outlines().some(e => e.dataset.layerId === second.id) &&
            outlines().some(e => e.getAttribute('x') === '-3' && e.getAttribute('y') === '-2'),
            'Multiple selections outline nested folder contents once, including off-canvas bounds');
        key('ArrowRight');
        assert(hit.getAttribute('points').startsWith('11,10') && outlines().find(e => e.dataset.layerId === second.id).getAttribute('x') === '12' &&
            second.cells[1212] === '#000000', 'Active-layer transforms leave other selected layers and their outlines stationary');
        editor.cancel(true);
        assert(overlay.hidden && !outlines().length, 'Cancel removes all selected-layer outlines');
        placementProject.activeLayerId = folder.id;
        placementProject.selectedLayerIds = [folder.id];
        bindLayer(placementProject);
        editor.selectLayers();
        assert(!overlay.hidden && !editor.active && outlines().length === 2 &&
            [...overlay.querySelectorAll('button')].every(button => button.hidden) && hit.style.display === 'none',
            'A selected folder outlines every descendant without exposing active-layer transform handles');
        editor.commit();
        assert(overlay.hidden && !outlines().length, 'Finalizing a folder selection clears its outlines');
        editor.selectLayers();
        key('Escape');
        assert(overlay.hidden && !outlines().length, 'Escape clears a folder-only selection outline');
        placementProject.activeLayerId = placementLayer.id;
        placementProject.selectedLayerIds = [placementLayer.id];
        bindLayer(placementProject);
        editor.selectLayers();
        assert(!outlines().length && !overlay.hidden && hit.style.display === '', 'Single selection clears other outlines and restores active handles');
    } finally { placementFixture.remove(); }
    const paddedRecord = { ...record, width: 3, height: 2, cols: 3, rows: 2, cells: Array(6).fill(null), referenceRect: { x: 1, y: 0, width: 2, height: 2 } };
    assert(validateProject(paddedRecord) === paddedRecord, 'Padded boards with a placed reference accepted');
    assert(validateProject({ ...paddedRecord, width: 2.4, referenceRect: { x: 0.4, y: 0, width: 2, height: 2 } }), 'Fractional padded boards accepted');
    rejects(() => validateProject({ ...paddedRecord, referenceRect: { x: 2, y: 0, width: 2, height: 2 } }), 'Reference outside the board rejected');
    rejects(() => validateProject({ ...paddedRecord, referenceRect: { x: 0, y: 0, width: 1.5, height: 2 } }), 'Non-integer reference size rejected');
    store = await openStore(database);
    await store.run('readwrite', table => table.put(serializedClone));
    const layersSaved = await store.run('readonly', table => table.get(record.id));
    assert(layersSaved.version === 2 && layersSaved.layers.length === 3 &&
        migrateLayers(layersSaved).cells[0] === '#abcdef', 'Layer names, hierarchy, active selection and pixels survive IndexedDB');
    await store.run('readwrite', table => table.put(blankRecord));
    const blankSaved = await store.run('readonly', table => table.get(record.id));
    assert(blankSaved.blank && blankSaved.cells.every(cell => cell === null) && !blankSaved.palette.length,
        'Blank project metadata and empty cells survive saving and reopening');
    await store.run('readwrite', table => table.put(record));
    const saved = await store.run('readonly', table => table.get(record.id));
    assert(saved.cells[0] === '#000000' && saved.cells[1] === null && saved.reference === record.reference, 'IndexedDB round trip retains painting, transparency and reference');
    await store.run('readwrite', table => table.put({ ...record, name: 'Updated' }));
    const listed = await store.run('readonly', table => table.getAll());
    assert(listed.length === 1 && listed[0].name === 'Updated', 'Saving updates rather than duplicates a project');
    await store.run('readwrite', table => table.put({ ...record, palette: [], cells: Array(4).fill(null) }));
    const empty = await store.run('readonly', table => table.get(record.id));
    assert(validateProject(empty).palette.length === 0, 'Empty-palette projects survive save and reopen validation');
    await store.run('readwrite', table => table.delete(record.id));
    assert((await store.run('readonly', table => table.getAll())).length === 0, 'Deleting removes a saved project');
    document.body.dataset.result = 'passed';
} catch (error) {
    results.push(`FAIL ${error.stack}`);
    document.body.dataset.result = 'failed';
} finally {
    if (store) store.close();
    indexedDB.deleteDatabase(database);
    document.getElementById('results').textContent = results.join('\n');
}
</script>
